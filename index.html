<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>담배소매업 주소지 히스토리 맵</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function() {
            const HASH = '8105a2e317c2cb234eb4c886040b30f658154ffede98310b4d030351bb069c31';
            const saved = sessionStorage.getItem('auth');
            if (saved === HASH) return;

            async function sha256(str) {
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
            }

            document.addEventListener('DOMContentLoaded', function() {
                const overlay = document.createElement('div');
                overlay.id = 'authOverlay';
                overlay.style.cssText = 'position:fixed;inset:0;background:#1e293b;z-index:9999;display:flex;align-items:center;justify-content:center;';
                overlay.innerHTML = `
                    <div style="background:white;padding:2rem;border-radius:1rem;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
                        <div style="font-size:2rem;margin-bottom:0.5rem;">🔒</div>
                        <h2 style="font-weight:bold;font-size:1.2rem;margin-bottom:1.5rem;color:#1e293b;">비밀번호를 입력하세요</h2>
                        <input id="pwInput" type="password" placeholder="비밀번호" style="width:100%;padding:0.6rem 1rem;border:1px solid #cbd5e1;border-radius:0.5rem;font-size:1rem;outline:none;box-sizing:border-box;" />
                        <p id="pwError" style="color:#ef4444;font-size:0.85rem;margin-top:0.5rem;min-height:1.2rem;"></p>
                        <button id="pwBtn" style="width:100%;margin-top:0.5rem;padding:0.6rem;background:#2563eb;color:white;border:none;border-radius:0.5rem;font-size:1rem;font-weight:bold;cursor:pointer;">확인</button>
                    </div>`;
                document.body.appendChild(overlay);

                async function tryAuth() {
                    const val = document.getElementById('pwInput').value;
                    const hashed = await sha256(val);
                    if (hashed === HASH) {
                        sessionStorage.setItem('auth', HASH);
                        overlay.remove();
                    } else {
                        document.getElementById('pwError').textContent = '비밀번호가 틀렸습니다.';
                        document.getElementById('pwInput').value = '';
                        document.getElementById('pwInput').focus();
                    }
                }
                document.getElementById('pwBtn').addEventListener('click', tryAuth);
                document.getElementById('pwInput').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') tryAuth();
                });
                document.getElementById('pwInput').focus();
            });
        })();
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- proj4js: 한국 TM좌표 → WGS84 변환 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Pretendard', sans-serif; }
        #map { width: 100%; height: 100%; z-index: 1; background-color: #f3f4f6; }
        
        /* Sidebar Styles */
        #sidebar {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30; /* 맵 컨트롤, 마커 위로 */
        }
        /* Mobile: Bottom Sheet */
        @media (max-width: 767px) {
            .sidebar-closed { transform: translateY(100%); }
            .sidebar-open { transform: translateY(0); }
        }
        /* Desktop: Right Sidebar */
        @media (min-width: 768px) {
            .sidebar-closed { transform: translateX(100%); }
            .sidebar-open { transform: translateX(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Loader */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        <!-- History Sidebar (Bottom Sheet on Mobile, Sidebar on Desktop) -->
        <div id="sidebar" class="absolute bottom-0 w-full h-[55%] md:top-0 md:right-0 md:bottom-auto md:w-96 md:h-full bg-white shadow-2xl sidebar-closed flex flex-col border-t md:border-t-0 md:border-l border-gray-200 rounded-t-2xl md:rounded-none">
            <div class="bg-gray-800 text-white p-4 md:p-5 flex justify-between items-center rounded-t-2xl md:rounded-none">
                <h2 class="text-base md:text-lg font-bold"><i class="fa-solid fa-clock-rotate-left mr-2"></i>주소지 인허가 히스토리</h2>

        <!-- Legend (Map Control) -->
        <div class="absolute bottom-6 left-4 md:left-6 bg-white p-3 md:p-4 rounded-xl shadow-lg z-10 border border-gray-200">
            <h3 class="font-bold text-xs md:text-sm text-gray-800 mb-2 border-b pb-1.5">범례</h3>
            <div class="flex items-center mb-1.5">
                <div class="w-4 h-6 md:w-5 md:h-7 mr-2 flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 35"><path fill="#f97316" d="M12 0C5.4 0 0 5.4 0 12c0 9 12 23 12 23s12-14 12-23c0-6.6-5.4-12-12-12z"/><path fill="#fff" d="M12 6l1.8 5.5h5.8l-4.7 3.4 1.8 5.5-4.7-3.4-4.7 3.4 1.8-5.5-4.7-3.4h5.8z"/></svg>
                </div>
                <span class="text-xs md:text-sm text-gray-700 font-bold text-orange-600">세븐일레븐</span>
            </div>

                <div class="w-4 h-6 md:w-5 md:h-7 mr-2 flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 35"><path fill="#3b82f6" d="M12 0C5.4 0 0 5.4 0 12c0 9 12 23 12 23s12-14 12-23c0-6.6-5.4-12-12-12z"/><circle cx="12" cy="12" r="5" fill="#fff"/></svg>

            </div>
            <div class="flex items-center">
                <div class="w-4 h-6 md:w-5 md:h-7 mr-2 flex justify-center items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 24 35"><path fill="#9ca3af" d="M12 0C5.4 0 0 5.4 0 12c0 9 12 23 12 23s12-14 12-23c0-6.6-5.4-12-12-12z"/><rect x="7" y="10.5" width="10" height="3" fill="#fff"/></svg>
                </div>
                <span class="text-xs md:text-sm text-gray-500">담배 판매소(폐업)</span>

        <!-- My Location Button (FAB) -->
        <button onclick="moveToMyLocation()" class="absolute bottom-6 right-4 md:bottom-6 md:right-6 bg-white w-12 h-12 md:w-14 md:h-14 rounded-full shadow-2xl border border-gray-200 text-gray-700 hover:text-blue-600 hover:bg-gray-50 transition flex items-center justify-center z-10 group" aria-label="내 위치">
            <i class="fa-solid fa-crosshairs text-xl group-active:text-blue-600"></i>
        </button>

    <script>
        let map;
        let clusterer;
        const markerCache = {}; // address → kakao.maps.Marker (숨김 상태로 등록)
        let groupedData = {};
        
        // 직접 입력해주신 카카오 JavaScript API 키
        const KAKAO_API_KEY = '21792ed90da16b4da6ab0d8978b26cd1';


        // 시 전체 코드 (구 단위 코드 없을 때 fallback)
        const CITY_CODES = {
            '서울특별시':'6110000_ALL','부산광역시':'6260000_ALL','대구광역시':'6270000_ALL',
            '인천광역시':'6280000_ALL','광주광역시':'6290000_ALL','대전광역시':'6300000_ALL',
            '울산광역시':'6310000_ALL','세종특별자치시':'5690000_ALL','경기도':'6410000_ALL',
            '강원도':'6530000_ALL','강원특별자치도':'6530000_ALL','충청북도':'6430000_ALL',
            '충청남도':'6440000_ALL','전라북도':'6540000_ALL','전북특별자치도':'6540000_ALL',
            '전라남도':'6460000_ALL','경상북도':'6470000_ALL','경상남도':'6480000_ALL',
            '제주특별자치도':'6500000_ALL',
        };

        let idleTimer = null;

        function initializeApp() {
            document.getElementById('loading').classList.remove('hidden');

            const script = document.createElement('script');
            script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_API_KEY}&libraries=services,clusterer&autoload=false`;

            script.onload = () => {
                try {
                    kakao.maps.load(() => {
                        try {
                            initMap();
                        } catch (err) {
                            console.error(err);
                        }
                    });
                } catch (e) {
                    console.error(e);
                }
            };
            document.head.appendChild(script);
        }

        function moveToMyLocation() {
            if (navigator.geolocation) {
                const loadingEl = document.getElementById('loading');
                const loadingText = document.querySelector('#loading span');
                loadingEl.classList.remove('hidden');
                loadingText.textContent = '위치 찾는 중...';

                navigator.geolocation.getCurrentPosition(
                    pos => {
                        const latlng = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
                        map.panTo(latlng);
                        loadingEl.classList.add('hidden');
                    },
                    () => {
                        loadingEl.classList.add('hidden');
                        alert('위치 권한이 차단되었거나 찾을 수 없습니다.');
                    },
                    { timeout: 5000, enableHighAccuracy: true }
                );
            } else {
                alert('현재 브라우저에서는 위치 기능을 지원하지 않습니다.');
            }
        }

        function initMap() {
            const container = document.getElementById('map');
            map = new kakao.maps.Map(container, {
                center: new kakao.maps.LatLng(37.5546, 126.9706),
                level: 3
            });

            const zoomControl = new kakao.maps.ZoomControl();
            map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

            clusterer = new kakao.maps.MarkerClusterer({
                map: map,
                averageCenter: true,
                minLevel: 5,
                disableClickZoom: false
            });

            kakao.maps.event.addListener(map, 'click', function() {
                closeSidebar();
            });

            // 현재 위치로 초기화
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        map.setCenter(new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
                        map.setLevel(4);
                    },
                    () => {} // 거부시 서울 기본값
                );
            }

            // 지도 이동 후 화면 마커 갱신
            kakao.maps.event.addListener(map, 'idle', () => {
                clearTimeout(idleTimer);
                idleTimer = setTimeout(() => {
                    refreshVisibleMarkers();
                }, 300);
            });
            
            // 데이터 수집 스크립트가 만든 data.json에서 한번에 로드
            loadStaticData();
        }

        async function loadStaticData() {
            const loadingText = document.querySelector('#loading span');
            loadingText.textContent = '데이터 파일(data.json) 로드 중...';
            
            try {
                const res = await fetch('data.json?t=' + new Date().getTime());
                if (!res.ok) throw new Error('data.json 로드 실패');
                
                const data = await res.json();
                
                const meta = data.metadata;
                document.getElementById('metaApiDate').textContent = meta.apiUpdateDate;
                document.getElementById('metaFetchDate').textContent = meta.fetchDate;
                document.getElementById('dataMetadata').classList.remove('hidden');
                
                loadingText.textContent = '마커 클러스터 렌더링 중...';
                
                const stores = data.stores;
                const newGroups = {};
                stores.forEach(store => {
                    const addr = store.a || `${store.y},${store.x}`;
                    if (!newGroups[addr]) newGroups[addr] = [];
                    newGroups[addr].push({
                        bplcNm: store.n,
                        dtlStateNm: store.s,
                        siteWhlAddr: store.a,
                        apvDt: store.o,
                        clgDt: store.c,
                        x: store.x,
                        y: store.y
                    });
                });
                
                registerMarkers(newGroups);
                refreshVisibleMarkers();
                
                document.getElementById('loading').classList.add('hidden');
            } catch (error) {
                console.error(error);
                loadingText.textContent = '로컬 데이터가 없습니다. (update_data.py 실행 필요)';
            }
        }

        // --- 3. 데이터 처리 및 마커 생성 ---

        // 마커 이미지 (한 번만 생성)
        let imgSevenEleven, imgOperating, imgClosed;
        function getMarkerImgs() {
            if (imgSevenEleven) return;
            const mk = (color) => {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 35;
                const ctx = c.getContext('2d');
                ctx.beginPath();
                ctx.arc(12, 12, 11, Math.PI, 0);
                ctx.lineTo(19, 12);
                ctx.bezierCurveTo(19, 22, 12, 32, 12, 32);
                ctx.bezierCurveTo(12, 32, 5, 22, 5, 12);
                ctx.closePath();
                ctx.fillStyle = color; ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1; ctx.stroke();
                return new kakao.maps.MarkerImage(c.toDataURL(), new kakao.maps.Size(24, 35), {offset: new kakao.maps.Point(12, 35)});
            };
            imgSevenEleven = mk('#f97316');
            imgOperating   = mk('#3b82f6');
            imgClosed      = mk('#9ca3af');
        }

        function processAndDisplayData(dataList) {
            const newGroups = {};
            dataList.forEach(current => {
                const address = normalizeAddress(current.siteWhlAddr) || `${current.y?.toFixed(5)},${current.x?.toFixed(5)}`;
                if (!address) return;
                if (!groupedData[address]) {
                    groupedData[address] = [];
                    newGroups[address] = groupedData[address];
                }
                groupedData[address].push(current);
                newGroups[address] = groupedData[address];
            });
            registerMarkers(newGroups);
            refreshVisibleMarkers();
        }

        function registerMarkers(grouped) {
            getMarkerImgs();
            const newMarkers = [];
            for (const address in grouped) {
                if (markerCache[address]) continue; // 이미 등록됨
                const historyList = grouped[address];
                const hasSevenEleven = historyList.some(s => /^세븐일레븐\s*.+점$/.test(s.bplcNm));
                // 영업 판단: 인허가일 있고 폐업일 없으면 = 영업중
                const isOperating = historyList.some(s => s.apvDt && !s.clgDt);
                const position = new kakao.maps.LatLng(historyList[0].y, historyList[0].x);

                const marker = new kakao.maps.Marker({
                    position,
                    title: address,
                    image: hasSevenEleven ? imgSevenEleven : isOperating ? imgOperating : imgClosed,
                    zIndex: hasSevenEleven ? 30 : isOperating ? 20 : 10,
                });
                markerCache[address] = marker;
                newMarkers.push(marker);
                
                kakao.maps.event.addListener(marker, 'click', function() {
                    openSidebar(address, historyList);
                    map.panTo(position); // 클릭 시 해당 마커로 맵 이동
                });
            }
            if (newMarkers.length > 0) {
                clusterer.addMarkers(newMarkers);
            }
        }

        // 현재 화면에 보이는 마커 개수 갱신 (마커 표시는 클러스터러가 담당)
        function refreshVisibleMarkers() {
            if (!map) return;
            const bounds = map.getBounds();
            const sw = bounds.getSouthWest();
            const ne = bounds.getNorthEast();
            let visCount = 0;
            for (const marker of Object.values(markerCache)) {
                const pos = marker.getPosition();
                const inView = pos.getLat() >= sw.getLat() && pos.getLat() <= ne.getLat() &&
                               pos.getLng() >= sw.getLng() && pos.getLng() <= ne.getLng();
                if (inView) visCount++;
            }
            const countNumEl = document.getElementById('markerCountNum');
            if (countNumEl) countNumEl.textContent = visCount.toLocaleString();
            const countEl = document.getElementById('markerCount');
            if (countEl) countEl.classList.toggle('hidden', visCount === 0);
        }

        // --- 4. UI 상호작용 (사이드바 히스토리) ---

        function openSidebar(address, historyList) {
            const sidebar = document.getElementById('sidebar');
            const addressEl = document.getElementById('selectedAddress');
            const historyContainer = document.getElementById('historyList');

            addressEl.textContent = address;
            historyContainer.innerHTML = ''; // 초기화

            // 날짜 최신순으로 정렬 (폐업일 또는 인허가일 기준)
            const sortedHistory = [...historyList].sort((a, b) => {
                const dateA = a.clgDt || a.apvDt;
                const dateB = b.clgDt || b.apvDt;
                return new Date(dateB) - new Date(dateA);
            });

            sortedHistory.forEach((store, index) => {
                // 영업 판단: 인허가일 있고 폐업일 없으면 = 영업중
                const isOperating = store.apvDt && !store.clgDt;
                const statusLabel = isOperating ? '영업중' : (store.clgDt ? '폐업' : store.dtlStateNm);
                const statusColor = isOperating ? 'text-green-600 bg-green-100 border-green-200' : 'text-red-600 bg-red-100 border-red-200';
                const isSevenEleven = store.bplcNm.includes('세븐일레븐');

                const card = document.createElement('div');
                card.className = `p-4 mb-4 rounded-lg border shadow-sm relative overflow-hidden ${isSevenEleven ? 'border-orange-300 bg-orange-50' : 'bg-white border-gray-100'}`;

                // 타임라인 연결선 (마지막 항목 제외)
                if (index < sortedHistory.length - 1) {
                    const line = document.createElement('div');
                    line.className = 'absolute bottom-0 left-8 w-0.5 h-4 bg-gray-200 translate-y-full';
                    card.appendChild(line);
                }

                const apvHtml = store.apvDt
                    ? `<p class="text-sm text-gray-500 mt-2"><i class="fa-regular fa-calendar-check mr-1"></i>인허가: ${store.apvDt}</p>`
                    : '';
                const clgHtml = store.clgDt
                    ? `<p class="text-sm text-red-400 mt-1"><i class="fa-regular fa-calendar-xmark mr-1"></i>폐업일: ${store.clgDt}</p>`
                    : (!isOperating && store.dtlStateNm ? `<p class="text-sm text-gray-400 mt-1"><i class="fa-regular fa-calendar-xmark mr-1"></i>폐업일: 날짜 없음</p>` : '');

                card.innerHTML += `
                    <div class="flex justify-between items-start">
                        <h4 class="font-bold text-gray-800 text-lg flex items-center">
                            ${isSevenEleven ? '<span class="text-orange-600 mr-1"><i class="fa-solid fa-store"></i></span>' : ''}
                            ${store.bplcNm}
                        </h4>
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold border ${statusColor}">
                            ${statusLabel}
                        </span>
                    </div>
                    ${apvHtml}${clgHtml}
                `;
                historyContainer.appendChild(card);
            });

            sidebar.classList.remove('sidebar-closed');
            sidebar.classList.add('sidebar-open');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.remove('sidebar-open');
            sidebar.classList.add('sidebar-closed');
        }

        // --- 5. 공공데이터 API 연동 및 지오코딩 ---



        // 페이지가 로드되면 자동으로 앱 초기화 실행
        window.addEventListener('DOMContentLoaded', initializeApp);

    </script>
</body>
</html>
